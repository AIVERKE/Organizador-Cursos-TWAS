version: "3.9"
services:
  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:76507680@db:5432/Cert_of
    depends_on:
      - db
    volumes:
      - .:/app

  db:
  image: postgres:17
  container_name: postgres_db
  restart: always
  ports:
      - "5432:5432"
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: 76507680
    POSTGRES_DB: Cert_of

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
