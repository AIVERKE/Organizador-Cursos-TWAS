  function verEstudiantes(idPonente) {
      fetch(`/ponente/estudiantes_curso/${idPonente}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            alert(data.error);
            return;
          }

          // Llenar título y descripción
          document.getElementById("titulo-curso").innerText = data.nombre_curso;
          document.getElementById("descripcion-curso").innerText = data.descripcion;

          // Llenar tabla de estudiantes
          const tbody = document.querySelector("#tabla-estudiantes tbody");
          tbody.innerHTML = ""; // limpiar

          data.estudiantes.forEach((est, i) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${i+1}</td>
              <td>${est.nombre}</td>
              <td>${est.email}</td>
            `;
            tbody.appendChild(tr);
          });

          // Mostrar modal
          document.getElementById("modal-estudiantes").style.display = "block";
        })
        .catch(err => console.error(err));
  }

  function cerrarModalEstudiantes() {
    document.getElementById("modal-estudiantes").style.display = "none";
  }

  <script>
function toDateInputValue(src) {
  if (!src) return '';
  if (typeof src === 'number') { // epoch ms
    try { return new Date(src).toISOString().slice(0,10); } catch(_) { return ''; }
  }
  const s = String(src).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); // YYYY-MM-DD...
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/); // DD/MM/YYYY o D-M-YYYY
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : d.toISOString().slice(0,10);
}

</script>

                document.getElementById('modal-editar').classList.add("activo");

              .catch(err => alert("Error al obtener los datos: " + err.message));
          });
        });

        // Envío editar Curso
        const formEditar = document.getElementById('form-editar-curso');
        if (formEditar) {
          formEditar.addEventListener('submit', function (e) {
            e.preventDefault();
            const id_curso = document.getElementById('id_curso').value;
            const data = {
              id_curso,
              nombre: document.getElementById('nombre').value,
              descripcion: document.getElementById('descripcion').value,
              modalidad: document.getElementById('modalidad').value,
            };

            fetch(`/cursos/coor/cursos/${id_curso}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            })
            .then(response => {
              if (response.ok) {
                alert(`Curso actualizado correctamente`);
                cerrarModalEdit();
                showSection(`cursos/coor/cursos`);
              } else {
                return response.json().then(err => {
                  throw new Error(err.error || "Error desconocido");
                });
              }
            })
            .catch(err => alert("Error al actualizar: " + err.message));
          });
        }

        // Boton Crear curso
        document.querySelectorAll('.create-curso-btn').forEach(btn => {
          btn.addEventListener("click", function () {
            const modal = document.getElementById("modal-crear");
            if (modal) modal.classList.add("activo");
          });
        });

        const formCrear = document.getElementById("form-crear-curso");
        if (formCrear) {
          formCrear.addEventListener("submit", async (e) => {
            e.preventDefault();
            const datos = {
              nombre: document.getElementById("nombre_crear").value,
              descripcion: document.getElementById("descripcion_crear").value,
              modalidad: document.getElementById("modalidad_crear").value,
              id_version: 1,
              id_ponente:1,
            };

            try {
              const res = await fetch(`/cursos/coor/cursos`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
              });

              const resultado = await res.json();

              if (res.ok) {
                alert(`Curso creado correctamente.`);
                cerrarModalCrear();
                showSection(`cursos/coor/cursos`);
              } else {
                alert("Error: " + resultado.error);
              }
            } catch (err) {
              alert("Error al crear el Curso.");
            }
          });
        }
        // Boton/Eliminar Curso
        document.querySelectorAll('.del-curso-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            if (confirm(`¿Seguro que quieres eliminar este Curso?`)) {
              fetch(`/cursos/coor/cursos/${id}`, { method: 'DELETE' })
                .then(response => {
                  if (response.ok) {
                    alert(`Curso eliminado correctamente.`);
                    showSection(`cursos/coor/cursos`);
                  } else {
                    return response.json().then(err => {
                      throw new Error(err.error || "Error desconocido");
                    });
                  }
                })
                .catch(err => alert("Error al eliminar: " + err.message));
            }
          });
        });
        let idCurso = null;
        document.querySelectorAll('.more-curso-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const idCurso = btn.dataset.id;

            Promise.all([
              fetch(`/cursos/coor/cursos/${idCurso}/ponente`).then(r => {
                if (!r.ok) throw new Error(`Error HTTP ${r.status}`);
                return r.json(); // { id_usuario, nombre, apellido, ... }
              }),
              fetch(`/cursos/coor/cursos/ponentes-disponibles`).then(r => {
                if (!r.ok) throw new Error(`Error HTTP ${r.status}`);
                return r.json(); // Array de usuarios ponentes
              })
            ])
            .then(([ponente, disponibles]) => {
              console.log(ponente[0]);
              console.log(disponibles);
              ponente=ponente[0];
              // Renderizar tabla de ponente actual
              const tbody = document.querySelector('#tabla-curso tbody');
              tbody.innerHTML = '';

              if (!ponente || ponente.id_usuario === 1) {
                tbody.innerHTML = `<tr><td colspan="2">Sin ponente asignado</td></tr>`;
              } else {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                  <td>${ponente.nombre}</td>
                  <td><button class="btn btn-sm btn-danger quitar-ponente" data-id="${idCurso}">Quitar</button></td>
                `;
                tbody.appendChild(fila);
              }

              // Poblar el <select> con ponentes disponibles
              const select = document.getElementById('select-exp');
              select.innerHTML = `<option value="">Selecciona un ponente...</option>`;
              disponibles.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nombre}`;
                select.appendChild(opt);
              });

              // Evento: quitar ponente
              document.querySelectorAll('.quitar-ponente').forEach(qBtn => {
                qBtn.onclick = () => {
                  const idCurso = qBtn.dataset.id;
                  fetch(`/cursos/coor/cursos/${idCurso}/desasignar_ponente`, {
                    method: 'DELETE'
                  })
                  .then(r => {
                    if (!r.ok) throw new Error('Error al quitar ponente');
                    return r.json();
                  })
                  .then(() => btn.click()) // recargar
                  .catch(err => alert(err.message));
                };
              });

              // Evento: asignar ponente
              const form = document.getElementById('form-agregar-exp');
              form.onsubmit = e => {
                e.preventDefault();
                const idPonente = select.value;
                console.log(idPonente);
                if (!idPonente) return;

                fetch(`/cursos/coor/cursos/${idCurso}/asignar_ponente`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ id_ponente: idPonente })
                })
                .then(r => {
                  if (!r.ok) throw new Error('Error al asignar ponente');
                  return r.json();
                })
                .then(() => btn.click()) // recargar
                .catch(err => alert(err.message));
              };

              // Mostrar el modal
              document.getElementById('modal-info-curso').classList.add('activo');
            })
            .catch(err => alert("Error al obtener datos del servidor: " + err.message));
          });
        });

        // Script para filtrar estudiantes
        const buscador = document.getElementById("buscador");
        if (buscador){
          buscador.addEventListener("keyup", function() {
            let filtro = this.value.toLowerCase();
            let filas = document.querySelectorAll("#tabla-estudiantes tbody tr");

            filas.forEach(function(fila) {
              let textoFila = fila.textContent.toLowerCase();
              fila.style.display = textoFila.includes(filtro) ? "" : "none";
            });
          });
        }
        

      }
      // Cerrar modales
      const btnClose = document.querySelector(".close");
      if (btnClose) {
        btnClose.addEventListener("click", cerrarModalCrear);
        btnClose.addEventListener("click", cerrarModalEdit);
      }
      function cerrarModalEdit() {
        const modal = document.getElementById("modal-editar");
        if (modal) modal.classList.remove("activo");
      }
      function cerrarModalCrear() {
        const modal = document.getElementById("modal-crear");
        if (modal) modal.classList.remove("activo");
      }
      function cerrarModalInfo() {
        const modal = document.getElementById("modal-info");
        if (modal) modal.classList.remove("activo");
      }
      function cerrarModalCursos() {
        const modal = document.getElementById("modal-info-curso");
        if (modal) modal.classList.remove("activo");
      }
      function cerrarModalPin() {
        const modal = document.getElementById("modal-pin");
        if (modal) modal.classList.remove("activo");
      }

      function cerrarModalMail() {
        const modal = document.getElementById("modal-mail");
        if (modal) modal.classList.remove("activo");
      }
      document.addEventListener("DOMContentLoaded", () => { 
        inicializarEventos();
        inicializarEventosCursos();    
        // Mostrar gráfico inicial
        fetch("/cursos/estadisticas/inscritos")
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const nombres = data.data.map(d => d.nombre);
            const inscritos = data.data.map(d => d.inscritos);
            const ctx = document.getElementById("chartInscritos").getContext("2d");
            new Chart(ctx, {
              type: "bar",
              data: {
                labels: nombres,
                datasets: [{
                  label: "Inscritos",
                  data: inscritos,
                  backgroundColor: "rgba(54, 162, 235, 0.6)",
                  borderColor: "rgba(54, 162, 235, 1)",
                  borderWidth: 1
                }]
              },
              options: {
                // responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                  y: { beginAtZero: true }
                }
              }
            });
        const total = inscritos.reduce((a, b) => a + b, 0);
        const porcentajes = inscritos.map(i => ((i / total) * 100).toFixed(1));

        // Gráfico de pastel
        const ctxPie = document.getElementById("chartPorcentaje").getContext("2d");
        new Chart(ctxPie, {
          type: "pie",
          data: {
            labels: nombres,
            datasets: [{
              data: porcentajes,
              backgroundColor: [
                "rgba(255, 99, 132, 0.6)",
                "rgba(54, 162, 235, 0.6)",
                "rgba(255, 206, 86, 0.6)",
                "rgba(75, 192, 192, 0.6)",
                "rgba(153, 102, 255, 0.6)"
              ]
            }]
          },
          options: {
            plugins: {
              legend: { position: "bottom" },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.label + ": " + context.raw + "%";
                  }
                }
              }
            },
            // responsive: true
          }
        });
          }
        })
        .catch(err => console.error("Error cargando gráfico:", err));
      });

      //buscador cursos
      (() => {
        // Normaliza mayúsculas/acentos para búsquedas más “humanas”
        const norm = s => (s || "")
            .toString()
            .normalize('NFD')
            .replace(/\p{Diacritic}/gu, '')
            .toLowerCase();

        // Delegación: escucha cualquier input que coincida con #buscador-cursos
        document.addEventListener('input', (e) => {
          if (!e.target.matches('#buscador-cursos')) return;

          const input = e.target;
          const filtro = norm(input.value);
          const selectorTabla = input.dataset.target || '#tabla-cursos';

          // Busca la tabla cercana; si no, usa el selector global
          const contenedor = input.closest('section, main, .contenido, body') || document;
          const tabla = contenedor.querySelector(selectorTabla) || document.querySelector(selectorTabla);
          if (!tabla || !tabla.tBodies || !tabla.tBodies[0]) return;

          const filas = Array.from(tabla.tBodies[0].rows);
          for (const tr of filas) {
            const texto = norm(tr.textContent);
            tr.style.display = texto.includes(filtro) ? '' : 'none';
          }
        });
      })();

      //Buscardo estudiantes

      (() => {
        // Normaliza mayúsculas/acentos para búsquedas más “humanas”
        const norm = s => (s || "")
            .toString()
            .normalize('NFD')
            .replace(/\p{Diacritic}/gu, '')
            .toLowerCase();

        // Delegación: escucha cualquier input que coincida con #buscador-cursos
        document.addEventListener('input', (e) => {
          if (!e.target.matches('#buscador-estudiante')) return;

          const input = e.target;
          const filtro = norm(input.value);
          const selectorTabla = input.dataset.target || '#tabla-estudiante';

          // Busca la tabla cercana; si no, usa el selector global
          const contenedor = input.closest('section, main, .contenido, body') || document;
          const tabla = contenedor.querySelector(selectorTabla) || document.querySelector(selectorTabla);
          if (!tabla || !tabla.tBodies || !tabla.tBodies[0]) return;

          const filas = Array.from(tabla.tBodies[0].rows);
          for (const tr of filas) {
            const texto = norm(tr.textContent);
            tr.style.display = texto.includes(filtro) ? '' : 'none';
          }
        });
      })();

      //Buscardo ponente
      (() => {
        // Normaliza mayúsculas/acentos para búsquedas más “humanas”
        const norm = s => (s || "")
            .toString()
            .normalize('NFD')
            .replace(/\p{Diacritic}/gu, '')
            .toLowerCase();

        // Delegación: escucha cualquier input que coincida con #buscador-cursos
        document.addEventListener('input', (e) => {
          if (!e.target.matches('#buscador-ponente')) return;

          const input = e.target;
          const filtro = norm(input.value);
          const selectorTabla = input.dataset.target || '#tabla-ponente';

          // Busca la tabla cercana; si no, usa el selector global
          const contenedor = input.closest('section, main, .contenido, body') || document;
          const tabla = contenedor.querySelector(selectorTabla) || document.querySelector(selectorTabla);
          if (!tabla || !tabla.tBodies || !tabla.tBodies[0]) return;

          const filas = Array.from(tabla.tBodies[0].rows);
          for (const tr of filas) {
            const texto = norm(tr.textContent);
            tr.style.display = texto.includes(filtro) ? '' : 'none';
          }
        });
      })();
    </script>

  </body>
