<h3>Gestión de Eventos</h3>

<table border="1" cellpadding="10" cellspacing="0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <!--
      <th>Versión</th>
      <th>Inicio</th>
      <th>Fin</th>
      <th>Lugar</th>
      -->
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for evento in eventos %}        
    <tr>
      <td data-label="ID">{{ evento.id_evento }}</td>
      <td data-label="Nombre">{{ evento.nombre_base }}</td>
      <!--
      <td data-label="Versión">{{ evento.version }}</td>
      <td data-label="Inicio">{{ evento.inicio }}</td>
      <td data-label="Fin">{{ evento.fin }}</td>
      <td data-label="Lugar">{{ evento.lugar }}</td>
      -->
      <td data-label="Acciones">
        <button onclick="">Editar</button>
        <button onclick="">Eliminar</button>            
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>


<br>

<button onclick="" class="menu-btn-h">Agregar Evento</button>
<button onclick="" class="menu-btn-h">Agregar Version de Evento</button>
