<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mis Asistencias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Estudiante/styleEstudiantes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Coordinador/styleCoordinador.css') }}">
</head>

<body>
    <div class="asistencias-container">
        <h1 class="asistencias-title">Mis certificados</h1>

        {% if inscripciones and inscripciones|length > 0 %}
        <table class="asistencias-table">
            <thead>
                <tr>
                    <th>Cursos</th>
                    <th>Certificado</th>
                </tr>
            </thead>
            <tbody>
                {% for a in inscripciones %}
                <tr>
                    <td> {{a.nombre_curso}} </td>
                    <td>
                        <button
                            onclick="window.location.href='{{ url_for('certificate.descargar_certificado', user_id=id_usuario) }}'"
                            class="btn btn-success cert-btn" title="Descargar Certificados">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-arrow-down-circle" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z" />
                            </svg>
                        </button>

                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="asistencias-empty">⚠️ No tienes certificados.</p>
        {% endif %}
    </div>
</body>

</html>
