<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión Estudiante</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/Estudiante/styleEstudiantes.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap"
    rel="stylesheet">
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/Coordinador/styleRxls.css') }}"> -->
 <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/Coordinador/styleCoordinador.css') }}">-->
</head>

<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo-back">
      <img class="logo" src="{{ url_for('static', filename='images/TWAS_Logo.webp') }}" />
    </div>

    <h1 class="titulo">GESTION ESTUDIANTE</h1>

    <div class="acciones-derecha">
      <div class="top-actions">
        <button onclick="location.href='/estudiante'">Estudiante</button>
        <button onclick="location.href='/auth/logout'">Cerrar Sesión</button>
      </div>
      <div class="logou">
        <img class="logo-umsa" src="{{ url_for('static', filename='images/EscudoUMSA.png') }}" alt="Logo UMSA" />
      </div>
    </div>
  </div>

  <!-- Contenedor principal -->
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>BIENVENIDO</h2>
      <h3>{{ estudiante.nombre }} {{ estudiante.apellido }}</h3>
      <p>Funciones</p>
      <ul class="menu">
        <li><a href="#" class="activo" onclick="mostrarSeccion('datos')">Datos Personales</a></li>
        <li>
          <a href="#"
            onclick="mostrarIframe('{{ url_for('qrs.ver_asistencias', id_usuario=estudiante.id_usuario) }}', this)">Mis
            Asistencias</a>
        </li>
      </ul>
    </aside>

    <!-- Contenido -->
    <main class="contenido">
      <div id="seccion-datos" class="datos-container">
        <div class="datos-content">
          <form method="GET" action="">
            <button type="button" class="btn-generar-qr" data-estudiante='{{ estudiante|tojson|safe }}'
              onclick="abrirModalEdit(this.dataset.estudiante)">
              Editar Datos
            </button>
          </form>
          <div class="info-estudiante">
            <input class="input-info" value="Nombre Completo: {{ estudiante.nombre }} {{ estudiante.apellido }}"
              readonly />
            <input class="input-info" value="Documento: {{ estudiante.documento }}" readonly />
            <input class="input-info" value="Email: {{ estudiante.email }}" readonly>
            <input class="input-info" value="Pais Origen: {{ estudiante.pais_origen }}" readonly />
            <input class="input-info" value="Pais Residencia: {{ estudiante.pais_residencia }}" readonly />
          </div>
          <div class="qr-container">
            {% if qr_path %}
            <img src="{{ qr_path }}" id="qr-estudiante" class="qr-img" alt="QR Estudiante" />
            {% else %}
            <p>No se ha generado un código QR para este estudiante.</p>
            <form method="GET" action="{{ url_for('qrs.generate_qr_by_id', id_usuario=estudiante.id_usuario) }}">
              <button type="submit" class="btn-generar-qr">Generar QR</button>
            </form>
            {% endif %}
          </div>
        </div>
      </div>

      <iframe id="seccion-iframe" name="contenido-frame" class="iframe-oculto"></iframe>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/estudianteControl.js') }}"></script>


<!-- Modal -->
<div id="modal-editar" class="modal">
  <div class="modal-content">
    <span class="close" onclick="cerrarModalEdit()">&times;</span>
    <h3>Editar Estudiante</h3>

    <form id="form-editar">
      <input type="hidden" id="id_usuario" name="id_usuario">

      <label>Nombre:</label>
      <input type="text" id="nombre" name="nombre" disabled><br>

      <label>Apellido:</label>
      <input type="text" id="apellido" name="apellido" disabled><br>

      <!-- <label>Email:</label>
      <input type="email" id="email" name="email" disabled><br> -->

<label>Email:</label>
<input
  type="email"
  id="email"
  name="email"
  class="readonly-input"
  readonly
  aria-readonly="true"
  data-static="true"
  title="El correo no puede modificarse. Si necesitas cambiarlo, contacta al coordinador."
><br>



      <label>Contraseña:</label>
      <input type="password" id="contrasena" name="contrasena" placeholder="Nueva contraseña (opcional)" disabled><br>

      <input type="hidden" id="documento" name="documento">

      <label>País de Origen:</label>
      <input type="text" id="pais_origen" name="pais_origen" disabled><br>

      <input type="hidden" id="id_rol" name="id_rol" value="3">

      <label>Fecha de nacimiento:</label>
      <input type="date" id="fecha_nac" name="fecha_nac" disabled><br>

      <label for="genero">Género:</label>
      <select id="genero" name="genero" disabled>
        <option value="" disabled selected>Seleccione género</option>
        <option value="male">Masculino</option>
        <option value="female">Femenino</option>
        <option value="other">Otro</option>
      </select><br>

      <label>País de residencia:</label>
      <input type="text" id="pais_residencia" name="pais_residencia" disabled><br>

      <label>Tipo de afiliacion:</label>
      <select id="tipo_afiliacion" name="tipo_afiliacion" disabled>
        <option value="" disabled selected>Seleccione tipo</option>
        <option value="public">Pública</option>
        <option value="private">Privada</option>
      </select><br>

      <label>Afiliacion U:</label>
      <input type="text" id="afiliacion_u" name="afiliacion_u" disabled><br>

      <label>Área tematica:</label>
      <input type="text" id="area_tematica" name="area_tematica" disabled><br>

      <label>Disciplina cientifica:</label>
      <input type="text" id="disciplina_cientifica" name="disciplina_cientifica" disabled><br>

      <!-- BOTONES -->
      <!-- <button type="button" id="btn-toggle-modo">Editar</button>
      <button type="button" id="btn-cancel" style="display:none;">Cancelar</button>
      <button type="submit" id="btn-guardar" style="display:none;">Guardar</button> -->

      <div class="form-actions">
  <button type="button" id="btn-toggle-modo" class="btn btn-outline">Editar</button>
  <button type="button" id="btn-cancel" class="btn btn-ghost" style="display:none;">Cancelar</button>
  <button type="submit" id="btn-guardar" class="btn btn-primary" style="display:none;">Guardar</button>
</div>

    </form>
  </div>
</div>

<script>
  function formatDate(dateString) {
    if (!dateString) return "";
    const d = new Date(dateString);
    if (isNaN(d)) return "";
    return d.toISOString().split('T')[0];
  }

  // snapshot para "Cancelar"
  let _snapshot = null;

  const EDITABLE_IDS = [
  "nombre","apellido","contrasena","pais_origen",
  "fecha_nac","genero","pais_residencia","afiliacion_u",
  "tipo_afiliacion","area_tematica","disciplina_cientifica"
];

  function setModoEdicion(activo) {
    // const ids = [
    //   "nombre","apellido","email","contrasena","pais_origen",
    //   "fecha_nac","genero","pais_residencia","afiliacion_u",
    //   "tipo_afiliacion","area_tematica","disciplina_cientifica"
    // ];
    EDITABLE_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = !activo;
    });

    const emailEl = document.getElementById("email");
  if (emailEl) emailEl.disabled = true;

    const form = document.getElementById("form-editar");
if (form) {
  form.classList.toggle("edit-mode", activo);
}


    document.getElementById("btn-toggle-modo").style.display = activo ? "none" : "inline-block";
    document.getElementById("btn-cancel").style.display      = activo ? "inline-block" : "none";
    document.getElementById("btn-guardar").style.display     = activo ? "inline-block" : "none";
  }

  // Recibe el JSON del data-estudiante del botón principal
  function abrirModalEdit(estudianteJson) {
    if (!estudianteJson) {
      console.error("No se recibieron datos del estudiante");
      return;
    }
    const estudiante = JSON.parse(estudianteJson);
    const modal = document.getElementById("modal-editar");

    // 🔴 Asegúrate de setear id_usuario
    document.getElementById("id_usuario").value          = estudiante.id_usuario || "";

    document.getElementById("nombre").value              = estudiante.nombre || "";
    document.getElementById("apellido").value            = estudiante.apellido || "";
    document.getElementById("email").value               = estudiante.email || "";
    document.getElementById("contrasena").value          = ""; // seguridad
    document.getElementById("documento").value           = estudiante.documento || "";
    document.getElementById("pais_origen").value         = estudiante.pais_origen || "";
    document.getElementById("id_rol").value              = estudiante.id_rol || 3;
    document.getElementById("fecha_nac").value           = formatDate(estudiante.fecha_nac) || "";
    document.getElementById("genero").value              = estudiante.genero || "";
    document.getElementById("pais_residencia").value     = estudiante.pais_residencia || "";
    document.getElementById("afiliacion_u").value        = estudiante.afiliacion_u || "";
    document.getElementById("tipo_afiliacion").value     = estudiante.tipo_afiliacion || "";
    document.getElementById("area_tematica").value       = estudiante.area_tematica || "";
    document.getElementById("disciplina_cientifica").value = estudiante.disciplina_cientifica || "";

    // Modo lectura por defecto
    setModoEdicion(false);

    // snapshot
    _snapshot = {
      nombre: document.getElementById("nombre").value,
      apellido: document.getElementById("apellido").value,
      email: document.getElementById("email").value,
      documento: document.getElementById("documento").value,
      pais_origen: document.getElementById("pais_origen").value,
      id_rol: document.getElementById("id_rol").value,
      fecha_nac: document.getElementById("fecha_nac").value,
      genero: document.getElementById("genero").value,
      pais_residencia: document.getElementById("pais_residencia").value,
      afiliacion_u: document.getElementById("afiliacion_u").value,
      tipo_afiliacion: document.getElementById("tipo_afiliacion").value,
      area_tematica: document.getElementById("area_tematica").value,
      disciplina_cientifica: document.getElementById("disciplina_cientifica").value,
    };

    modal.style.display = "flex";
  }

  function cerrarModalEdit() {
    document.getElementById("modal-editar").style.display = "none";
    _snapshot = null;
  }

  // Toggle a edición
  document.getElementById("btn-toggle-modo").addEventListener("click", () => {
    setModoEdicion(true);
  });

  // Cancelar edición
  document.getElementById("btn-cancel").addEventListener("click", () => {
    if (_snapshot) {
      for (const k in _snapshot) {
        const el = document.getElementById(k);
        if (el) el.value = _snapshot[k];
      }
      document.getElementById("contrasena").value = "";
    }
    setModoEdicion(false);
  });

  // Guardar (PUT)
  const formEditar = document.getElementById("form-editar");
  formEditar.addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      nombre: document.getElementById("nombre").value,
      apellido: document.getElementById("apellido").value,
      email: document.getElementById("email").value,
      documento: document.getElementById("documento").value,
      pais_origen: document.getElementById("pais_origen").value,
      id_rol: document.getElementById("id_rol").value,
      fecha_nac: document.getElementById("fecha_nac").value,
      genero: document.getElementById("genero").value,
      pais_residencia: document.getElementById("pais_residencia").value,
      afiliacion_u: document.getElementById("afiliacion_u").value,
      tipo_afiliacion: document.getElementById("tipo_afiliacion").value,
      area_tematica: document.getElementById("area_tematica").value,
      disciplina_cientifica: document.getElementById("disciplina_cientifica").value,
      contrasena: document.getElementById("contrasena").value || null
    };

//Hola aca se hicieron cambios 05-10-2025 8:56PM 🔥👄🔥

    const id_usuario = document.getElementById("id_usuario").value;

    // Si tu endpoint real es diferente, cámbialo aquí:
    const endpoint = `/usuarios/coor/estudiantes/${id_usuario}`;

    document.getElementById("btn-guardar").disabled = true;
    try {
      const res = await fetch(endpoint, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.mensaje || "Error al actualizar");

      alert(data.mensaje || "Actualizado correctamente");
      cerrarModalEdit();
      location.reload();
    } catch (err) {
      console.error(err);
      alert("No se pudo guardar: " + err.message);
    } finally {
      document.getElementById("btn-guardar").disabled = false;
    }
  });

  // Cerrar al click fuera
  window.onclick = function (event) {
    const modal = document.getElementById("modal-editar");
    if (event.target === modal) cerrarModalEdit();
  };
</script>

</body>
</html>
