<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia Registrada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .informacion {
      text-align: center;
      padding: 3rem 2rem;
      background: #fff;
      max-width: 500px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .informacion:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .informacion p {
      font-size: 1.4rem;
      color: #0077c2;
      margin-bottom: 2rem;
      font-weight: 500;
    }

    .check-icon {
      font-size: 60px;
      color: #0077c2;
      margin-bottom: 1rem;
    }

    .btn-volver {
      display: inline-block;
      border: 2px solid #0077c2;
      padding: 0.75rem 2rem;
      background: transparent;
      color: #0077c2;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
    }

    .btn-volver:hover {
      background: #0077c2;
      color: white;
      transform: scale(1.05);
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .informacion {
        padding: 2.5rem 1.5rem;
      }

      .informacion p {
        font-size: 1.2rem;
      }

      .btn-volver {
        padding: 0.7rem 1.5rem;
        font-size: 0.95rem;
      }

      .check-icon {
        font-size: 50px;
      }
    }

    @media (max-width: 480px) {
      .informacion {
        padding: 2rem 1rem;
      }

      .informacion p {
        font-size: 1.1rem;
      }

      .btn-volver {
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }

      .check-icon {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <section class="informacion">
    <div class="check-icon">✅</div>
    <p>La asistencia ha sido registrada correctamente.</p>
    <a class="btn-volver" href="{{ url_for('auth.dashboard') }}">Volver al inicio</a>
  </section>
</body>
</html>
