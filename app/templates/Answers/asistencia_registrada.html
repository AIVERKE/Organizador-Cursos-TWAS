<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistencia Ya Registrada</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/Estudiante/styleEstudiantes.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat Alternates', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      border: 2px solid #c62828;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      max-width: 500px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    .card h1 {
      color: #c62828;
      margin-bottom: 1rem;
    }

    .check-icon {
      font-size: 60px;
      color: #c62828;
      margin-bottom: 1rem;
    }

    .info {
      font-size: 18px;
      margin-bottom: 1rem;
    }

    .btn-volver {
      padding: 0.7rem 1.5rem;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-volver:hover {
      background: #8e0000;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-icon">❌</div>
    <h1>¡El participante ya se registró!</h1>
    <p class="info">
      El participante tiene una asistencia registrada el día de hoy. <br>
      {% if fecha %}
        Última vez registrada: <strong>{{ fecha }}</strong>
      {% else %}
        Intenta nuevamente mañana.
      {% endif %}
    </p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn-volver">
      Volver al perfil
    </a>
  </div>
</body>
</html>
