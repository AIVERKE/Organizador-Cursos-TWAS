<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Límite de Asistencias Alcanzado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/Estudiante/styleEstudiantes.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat Alternates', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }

    .card {
      background: #fff;
      border: 2px solid #c62828;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    .card h1 {
      color: #c62828;
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }

    .check-icon {
      font-size: 60px;
      color: #c62828;
      margin-bottom: 1rem;
    }

    .info {
      font-size: 18px;
      margin-bottom: 1rem;
    }

    .btn-volver {
      padding: 0.7rem 1.5rem;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-volver:hover {
      background: #8e0000;
    }

    /* Media Queries para dispositivos más pequeños */
    @media (max-width: 768px) {
      .card {
        padding: 1.5rem;
      }

      .card h1 {
        font-size: 1.6rem;
      }

      .check-icon {
        font-size: 50px;
      }

      .info {
        font-size: 16px;
      }

      .btn-volver {
        font-size: 15px;
        padding: 0.6rem 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 1rem;
      }

      .card h1 {
        font-size: 1.4rem;
      }

      .check-icon {
        font-size: 40px;
      }

      .info {
        font-size: 14px;
      }

      .btn-volver {
        font-size: 14px;
        padding: 0.5rem 1rem;
      }
    }
  </style>

</head>
<body>
  <div class="card">
    <div class="check-icon">❌</div>
    <h1>¡Límite de asistencias alcanzado!</h1>
    <p class="info">
      El participante ya ha registrado el máximo de asistencias permitidas para hoy. <br>
    </p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn-volver">
      Volver al perfil
    </a>
  </div>
</body>
</html>
